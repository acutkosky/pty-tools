[project]
name = "pty-tools"
version = "0.2.0"
authors = [{ name = "Ashok Cutkosky" }]
description = "PTY management tools for spawning and interacting with terminal processes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyte>=0.8"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
pty = "pty_tools.cli:main"

[project.urls]
Source = "https://github.com/acutkosky/pty-tools"
Issues = "https://github.com/acutkosky/pty-tools/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pty_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
